# ---------------------------------------------------------------------------
# Servidor estático + proxy de la API para MultiCatálogo (nginx:alpine).
#
# IMPORTANTE: este archivo es un FRAGMENTO de servidor, NO un nginx.conf
# completo. Se instala en `/etc/nginx/conf.d/default.conf`, que el
# `/etc/nginx/nginx.conf` de la imagen alpine ya incluye dentro de su bloque
# `http`. Por eso acá NO debe haber `events {}` ni `http {}`: si se pusieran,
# nginx no arrancaría ("\"events\" directive is not allowed here").
#
# Responsabilidades:
#   1. Servir el build de Vite (`dist/`) con el fallback de SPA.
#   2. Servir `/api` desde el MISMO origen que la app (proxy a backend:3000).
#   3. Aplicar las políticas de caché que necesita la PWA.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # No se filtra la versión de nginx en las cabeceras ni en los errores.
    server_tokens off;

    # La app no sube archivos: 1 MB es suficiente y acotar el cuerpo de la
    # petición evita que un request gigante consuma memoria del contenedor.
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/manifest+json
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        font/woff2;

    # --- El service worker: nunca se cachea en el servidor ----------------
    # Si el navegador guarda un `sw.js` viejo, la app queda clavada en una
    # versión anterior para siempre. El SW se valida en cada carga y se
    # actualiza solo cuando el contenido cambia.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # `expires -1` agrega `Expires: <pasado>` y `Cache-Control: no-cache`.
        # Se combina con el `add_header` de arriba: HTTP permite varios
        # Cache-Control y el cliente los une (gana `no-store`).
        expires -1;
        try_files $uri =404;
    }

    # --- Manifest ---------------------------------------------------------
    location = /manifest.webmanifest {
        # `webmanifest` no está en el mapa de tipos por defecto de nginx.
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Shell de la SPA --------------------------------------------------
    # `no-cache, must-revalidate`: el HTML se revalida siempre, así que un
    # deploy nuevo se ve sin esperar a que expiren los assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Assets con hash en el nombre -------------------------------------
    # Vite mete el hash del contenido en el nombre del archivo: si cambia el
    # contenido, cambia la URL. Se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Íconos y fuentes auto-alojadas -----------------------------------
    location /pwa-icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- API en el mismo origen -------------------------------------------
    # El service worker sólo cachea lo que está en su propio origen y el JWT
    # debe vivir en un único origen: por eso `/api` se reenvía al backend sin
    # cambiar de host. Nunca se cachea.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Redirección de `/api` (sin barra) a `/api/`, para que no caiga en el
    # fallback de la SPA y devuelva el index.html en vez de un 404 del API.
    location = /api {
        return 308 /api/;
    }

    # --- Fallback de SPA --------------------------------------------------
    # Sin esto, un refresh en `/producto/42` daría 404 y el *navigation
    # fallback* del service worker no tendría destino.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
